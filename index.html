<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para a Minha Namorada ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #1a0a0a;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: linear-gradient(135deg, #1a0a0a 0%, #3d0a1a 40%, #5c0a2a 70%, #1a0a0a 100%);
            overflow: hidden;
        }

        /* Fundo animado - mais brilho */
        .bg-glow {
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 50, 100, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(255, 100, 150, 0.35) 0%, transparent 45%),
                        radial-gradient(circle at 50% 50%, rgba(255, 30, 90, 0.2) 0%, transparent 60%);
            animation: glowPulse 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes glowPulse {
            0% { transform: scale(1) rotate(0deg); opacity: 0.7; }
            100% { transform: scale(1.1) rotate(5deg); opacity: 1; }
        }

        /* Corações flutuantes */
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 120, 150, 0.85);
            animation: floatHeart linear infinite;
            text-shadow: 0 0 12px rgba(255, 50, 100, 0.8),
                         0 0 25px rgba(255, 80, 130, 0.5);
            user-select: none;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Conteúdo principal */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            max-width: 90%;
        }

        .subtitle {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 180, 200, 0.85);
            margin-bottom: 12px;
            animation: fadeInUp 1.2s ease-out 0.3s both;
        }

        .main-title {
            font-size: clamp(2.8rem, 10vw, 5.5rem);
            font-weight: 700;
            line-height: 1.1;
            background: linear-gradient(90deg, #ff6b9d, #ff3d6e, #ff8fab, #ff6b9d);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: fadeInUp 1.2s ease-out 0.5s both,
                       gradientMove 6s ease infinite;
            text-shadow: 0 0 40px rgba(255, 60, 120, 0.3);
            margin-bottom: 20px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .message {
            font-size: clamp(1.05rem, 3.5vw, 1.35rem);
            line-height: 1.7;
            color: rgba(255, 230, 240, 0.92);
            max-width: 520px;
            margin: 0 auto 30px;
            animation: fadeInUp 1.2s ease-out 0.8s both;
        }

        .message strong {
            color: #ff8fab;
        }

        /* Coração central bem bonito */
        .heart-wrapper {
            position: relative;
            width: clamp(110px, 28vw, 180px);
            height: clamp(110px, 28vw, 180px);
            margin: 15px auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInUp 1.2s ease-out 0.65s both;
        }

        .heart-big {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: heartbeat 1.35s ease-in-out infinite;
            filter: drop-shadow(0 0 35px rgba(255, 40, 100, 0.95))
                    drop-shadow(0 0 60px rgba(255, 20, 80, 0.7))
                    drop-shadow(0 0 90px rgba(255, 50, 120, 0.5));
        }

        /* Coração feito com CSS + SVG interno */
        .heart-big svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(255, 100, 150, 0.8))
                    drop-shadow(0 10px 25px rgba(255, 20, 80, 0.6));
        }

        .heart-big .heart-path {
            fill: url(#heartGradient);
            stroke: rgba(255, 200, 220, 0.55);
            stroke-width: 2.5;
        }

        /* Brilho pulsante atrás do coração - mais intenso */
        .heart-glow {
            position: absolute;
            width: 180%;
            height: 180%;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(255, 60, 120, 0.75) 0%, 
                rgba(255, 40, 100, 0.45) 35%, 
                transparent 70%);
            animation: heartGlow 1.35s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }

        /* Segundo brilho extra */
        .heart-glow-2 {
            position: absolute;
            width: 230%;
            height: 230%;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(255, 80, 140, 0.4) 0%, 
                transparent 60%);
            animation: heartGlow 1.35s ease-in-out infinite 0.15s;
            z-index: -2;
            pointer-events: none;
        }

        @keyframes heartbeat {
            0%   { transform: scale(1); }
            14%  { transform: scale(1.2); }
            28%  { transform: scale(1); }
            42%  { transform: scale(1.14); }
            70%  { transform: scale(1); }
            100% { transform: scale(1); }
        }

        @keyframes heartGlow {
            0%   { transform: scale(0.8); opacity: 0.55; }
            14%  { transform: scale(1.25); opacity: 1; }
            28%  { transform: scale(0.9); opacity: 0.6; }
            42%  { transform: scale(1.15); opacity: 0.9; }
            70%  { transform: scale(0.9); opacity: 0.55; }
            100% { transform: scale(0.8); opacity: 0.55; }
        }

        .footer {
            font-size: 0.95rem;
            color: rgba(255, 180, 200, 0.7);
            letter-spacing: 1px;
            animation: fadeInUp 1.2s ease-out 1.1s both;
        }

        .footer span {
            color: #ff8fab;
            font-weight: 600;
        }

        /* Botão de música */
        .music-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 60, 100, 0.25);
            border: 2px solid rgba(255, 150, 180, 0.5);
            color: #ffb3c6;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 50, 100, 0.3);
            animation: fadeInUp 1.2s ease-out 1.4s both;
        }

        .music-btn:hover {
            background: rgba(255, 60, 100, 0.45);
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 50, 100, 0.55);
        }

        .music-btn.playing {
            background: rgba(255, 60, 100, 0.55);
            border-color: #ff8fab;
            box-shadow: 0 0 25px rgba(255, 80, 130, 0.6);
            animation: musicPulse 1.5s ease-in-out infinite;
        }

        @keyframes musicPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 50, 100, 0.4); }
            50% { box-shadow: 0 0 35px rgba(255, 80, 140, 0.7); }
        }

        .music-note {
            display: none;
            position: fixed;
            bottom: 90px;
            right: 20px;
            font-size: 0.8rem;
            color: rgba(255, 180, 200, 0.7);
            background: rgba(30, 10, 20, 0.7);
            padding: 6px 12px;
            border-radius: 20px;
            z-index: 50;
            backdrop-filter: blur(6px);
            pointer-events: none;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Partículas extras */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff6b9d;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFloat 12s linear infinite;
            opacity: 0.6;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            90% { opacity: 0.4; }
            100% {
                transform: translateY(-10vh) translateX(30px);
                opacity: 0;
            }
        }

        /* Toque suave no mobile */
        @media (max-width: 600px) {
            .content {
                padding: 15px;
            }
            .message {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bg-glow"></div>
        <div class="hearts" id="hearts"></div>

        <div class="content">
            <div class="subtitle">Para a mulher da minha vida</div>
            
            <h1 class="main-title">Eu te amo</h1>
            
            <div class="heart-wrapper">
                <div class="heart-glow-2"></div>
                <div class="heart-glow"></div>
                <div class="heart-big">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ff4d7a"/>
                                <stop offset="40%" stop-color="#ff1a5e"/>
                                <stop offset="70%" stop-color="#ff3d7a"/>
                                <stop offset="100%" stop-color="#ff6b9d"/>
                            </linearGradient>
                        </defs>
                        <path class="heart-path" d="M50 88 
                            C 20 65, 5 45, 5 28 
                            C 5 12, 18 2, 32 2 
                            C 42 2, 48 10, 50 16 
                            C 52 10, 58 2, 68 2 
                            C 82 2, 95 12, 95 28 
                            C 95 45, 80 65, 50 88 Z"/>
                    </svg>
                </div>
            </div>
            
            <p class="message">
                Você é o motivo do meu sorriso todos os dias.<br>
                Obrigado por existir, por me amar e por ser exatamente quem você é.<br><br>
                <strong>Você é o meu lugar favorito no mundo.</strong>
            </p>
            
            <div class="footer">
                Com todo o meu coração,<br>
                <span>Seu namorado ❤️</span>
            </div>
        </div>
    </div>

    <!-- ===== ÁUDIO / MÚSICA ===== -->
    <!-- 
      COMO USAR:
      1. Coloque o arquivo de música na mesma pasta deste HTML
      2. Troque o nome "sua-musica.mp3" pelo nome real do arquivo
      3. Formatos que funcionam: .mp3, .ogg, .wav
    -->
    <audio id="bg-music" loop>
        <source src="sua-musica.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <button class="music-btn" id="musicBtn" title="Tocar / Pausar música">
        ▶
    </button>
    <div class="music-note" id="musicNote">Clique para tocar a música</div>

    <script>
        // Corações flutuantes
        const heartsContainer = document.getElementById('hearts');
        const heartSymbols = ['❤️', '💕', '💗', '💓', '💞', '💖'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            
            const size = Math.random() * 22 + 14;
            heart.style.fontSize = size + 'px';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 8 + 7) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.4;
            
            heartsContainer.appendChild(heart);
            
            // Remove depois que a animação termina
            setTimeout(() => {
                heart.remove();
            }, 15000);
        }

        // Cria corações continuamente
        setInterval(createHeart, 600);
        
        // Alguns corações iniciais
        for (let i = 0; i < 12; i++) {
            setTimeout(createHeart, i * 300);
        }

        // Partículas pequenas
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (Math.random() * 8 + 8) + 's';
            particle.style.animationDelay = Math.random() * 3 + 's';
            
            document.querySelector('.container').appendChild(particle);
            
            setTimeout(() => particle.remove(), 16000);
        }

        setInterval(createParticle, 400);

        // ===== CONTROLE DE MÚSICA =====
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('musicBtn');
        const musicNote = document.getElementById('musicNote');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                music.pause();
                musicBtn.textContent = '▶';
                musicBtn.classList.remove('playing');
                musicNote.style.display = 'none';
            } else {
                music.play().then(() => {
                    musicBtn.textContent = '❚❚';
                    musicBtn.classList.add('playing');
                    musicNote.style.display = 'none';
                }).catch(() => {
                    // Se o arquivo não existir ou der erro
                    musicNote.textContent = 'Coloque o arquivo "sua-musica.mp3" na pasta';
                    musicNote.style.display = 'block';
                    setTimeout(() => musicNote.style.display = 'none', 4000);
                });
            }
            isPlaying = !isPlaying;
        });

        // Mostra a dica por alguns segundos no início
        setTimeout(() => {
            musicNote.style.display = 'block';
            setTimeout(() => {
                if (!isPlaying) musicNote.style.display = 'none';
            }, 3500);
        }, 1800);

        // Impede o scroll e zoom no mobile
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', e => e.preventDefault());
    </script>
</body>
</html>
